services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: postgres
      CATALOGUE_DB_NAME: ${CATALOGUE_DB_NAME:?Set CATALOGUE_DB_NAME in .env}
      ORDER_DB_NAME: ${ORDER_DB_NAME:?Set ORDER_DB_NAME in .env}
      CATALOGUE_TEST_DB_NAME: ${CATALOGUE_TEST_DB_NAME:-online_shop_catalogue_test}
      ORDER_TEST_DB_NAME: ${ORDER_TEST_DB_NAME:-online_shop_order_test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
